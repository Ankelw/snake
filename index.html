<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 ГАЛДА-ЗМЕЙКА</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;display:flex;justify-content:center;align-items:center;height:100vh;touch-action:none;font-family:Arial,sans-serif;overflow:hidden}
canvas{border:2px solid #00ffaa;border-radius:12px;box-shadow:0 0 40px #00ffaa33;background:#0a0a14;touch-action:none}
.score{color:#fff;font-size:20px;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:5;text-shadow:0 0 10px #00ffaa66}
.golda{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:70px;font-weight:bold;color:#ffdd00;text-shadow:0 0 40px #ffdd00;pointer-events:none;opacity:0;z-index:10}
.golda.show{animation:ga .8s ease-out forwards}
@keyframes ga{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.over{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.88);display:none;justify-content:center;align-items:center;flex-direction:column;gap:20px;z-index:20}
.over.show{display:flex}
.over h1{color:#ff1493;font-size:36px;text-shadow:0 0 30px #ff149366}
.over .fs{color:#00ffaa;font-size:24px}
.over .rb{padding:15px 40px;border:2px solid #00ffaa;border-radius:30px;background:transparent;color:#00ffaa;font-size:18px;cursor:pointer;touch-action:manipulation}
.over .rb:active{background:#00ffaa;color:#0a0a14}
</style>
</head>
<body>
<div class="score">🐍 <span id="s">0</span></div>
<canvas id="c"></canvas>
<div class="golda" id="g">ГАЛДА!</div>
<div class="over" id="o"><h1>💀 ИГРА ОКОНЧЕНА</h1><div class="fs">🍎 <span id="fs">0</span></div><button class="rb" id="rb">🔄 Ещё</button></div>
<script>
// ========== СОЗДАЕМ ЗВУКИ ==========
// Звук съедания (короткий писк)
function createEatSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.value = 0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.stop(ctx.currentTime + 0.15);
}

// Звук Game Over (низкий звук)
function createGameOverSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 300;
    osc.type = 'sawtooth';
    gain.gain.value = 0.2;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.stop(ctx.currentTime + 0.4);
}

// Звук движения (тихий клик)
function createMoveSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 600;
    osc.type = 'sine';
    gain.gain.value = 0.08;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.stop(ctx.currentTime + 0.05);
}

// ========== ПОЛУЧАЕМ ЭЛЕМЕНТЫ ==========
const C = document.getElementById('c');
const X = C.getContext('2d');
const S = document.getElementById('s');
const FS = document.getElementById('fs');
const O = document.getElementById('o');
const G = document.getElementById('g');
const RB = document.getElementById('rb');

let W, H, SZ = 20, COLS, ROWS;

function resize(){
    const size = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.78, 500);
    C.width = size;
    C.height = size;
    COLS = Math.floor(size / SZ);
    ROWS = Math.floor(size / SZ);
    W = COLS; H = ROWS;
}
resize();
window.addEventListener('resize', resize);

let snake = [], food = {}, dir = {x:1,y:0}, nd = {x:1,y:0};
let score = 0, running = true, loop = null, parts = [], touch = null;
let moveCounter = 0;

function init(){
    const x = Math.floor(COLS/2), y = Math.floor(ROWS/2);
    snake = [{x,y}, {x:x-1,y}, {x:x-2,y}];
    dir = {x:1,y:0}; nd = {x:1,y:0};
    score = 0; parts = []; running = true;
    moveCounter = 0;
    O.classList.remove('show');
    S.textContent = '0';
    spawn();
    draw();
}

function spawn(){
    let p;
    do {
        p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
}

function particles(x, y){
    const colors = ['#ff1493','#ffdd00','#00ccff','#ff00ff','#00ffaa'];
    for(let i=0; i<25; i++){
        parts.push({
            x: x*SZ + SZ/2,
            y: y*SZ + SZ/2,
            vx: (Math.random()-.5)*10,
            vy: (Math.random()-.5)*10,
            life: 30,
            max: 30,
            color: colors[Math.floor(Math.random()*colors.length)]
        });
    }
}

function updateParts(){
    for(let i=parts.length-1; i>=0; i--){
        const p = parts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) parts.splice(i, 1);
    }
}

function drawParts(){
    for(const p of parts){
        const a = p.life / p.max;
        X.globalAlpha = a;
        X.fillStyle = p.color;
        X.beginPath();
        X.arc(p.x, p.y, 4*a + 1, 0, Math.PI*2);
        X.fill();
    }
    X.globalAlpha = 1;
}

function showGolda(){
    // Звук съедания!
    try { createEatSound(); } catch(e) {}
    
    G.classList.remove('show');
    void G.offsetWidth;
    G.classList.add('show');
    setTimeout(() => G.classList.remove('show'), 800);
}

function update(){
    if(!running) return;
    dir = {...nd};
    const h = snake[0];
    const nh = {x: h.x + dir.x, y: h.y + dir.y};
    
    if(nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS){
        gameOver();
        return;
    }
    if(snake.some(s => s.x === nh.x && s.y === nh.y)){
        gameOver();
        return;
    }
    
    snake.unshift(nh);
    
    // Звук движения (каждый 2-й шаг)
    moveCounter++;
    if(moveCounter % 2 === 0) {
        try { createMoveSound(); } catch(e) {}
    }
    
    if(nh.x === food.x && nh.y === food.y){
        score++;
        S.textContent = score;
        particles(food.x, food.y);
        showGolda();
        spawn();
    } else {
        snake.pop();
    }
    
    updateParts();
    draw();
}

function gameOver(){
    running = false;
    FS.textContent = score;
    O.classList.add('show');
    // Звук Game Over!
    try { createGameOverSound(); } catch(e) {}
}

function draw(){
    X.fillStyle = '#0a0a14';
    X.fillRect(0,0,C.width,C.height);
    
    X.strokeStyle = '#1a1a2e';
    X.lineWidth = 0.5;
    for(let x=0; x<=C.width; x+=SZ){
        X.beginPath();
        X.moveTo(x,0);
        X.lineTo(x,C.height);
        X.stroke();
    }
    for(let y=0; y<=C.height; y+=SZ){
        X.beginPath();
        X.moveTo(0,y);
        X.lineTo(C.width,y);
        X.stroke();
    }
    
    for(let i=0; i<snake.length; i++){
        const s = snake[i];
        const x = s.x * SZ;
        const y = s.y * SZ;
        const h = i === 0;
        
        if(h){ X.shadowColor = '#00ffaa'; X.shadowBlur = 20; }
        X.fillStyle = h ? '#00ffaa' : '#00cc88';
        X.beginPath();
        X.roundRect(x+1, y+1, SZ-2, SZ-2, 4);
        X.fill();
        X.shadowBlur = 0;
        
        if(h){
            const e = 3, o = 6;
            let a,b,c,d;
            if(dir.x === 1){ a=x+SZ-o; b=y+o; c=x+SZ-o; d=y+SZ-o; }
            else if(dir.x === -1){ a=x+o; b=y+o; c=x+o; d=y+SZ-o; }
            else if(dir.y === -1){ a=x+o; b=y+o; c=x+SZ-o; d=y+o; }
            else { a=x+o; b=y+SZ-o; c=x+SZ-o; d=y+SZ-o; }
            X.fillStyle = '#fff';
            X.beginPath();
            X.arc(a,b,e,0,Math.PI*2);
            X.fill();
            X.beginPath();
            X.arc(c,d,e,0,Math.PI*2);
            X.fill();
        }
    }
    
    const fx = food.x * SZ;
    const fy = food.y * SZ;
    const p = 4 * (Date.now() % 500 / 500);
    X.shadowColor = '#ff1493';
    X.shadowBlur = 25 + p;
    X.fillStyle = '#ff1493';
    X.beginPath();
    X.roundRect(fx+2, fy+2, SZ-4, SZ-4, 6);
    X.fill();
    X.shadowBlur = 0;
    X.fillStyle = 'rgba(255,255,255,0.3)';
    X.beginPath();
    X.arc(fx+7, fy+7, 3, 0, Math.PI*2);
    X.fill();
    
    drawParts();
}

function setDir(x, y){
    if(dir.x !== -x || dir.y !== -y) nd = {x, y};
}

// ========== УПРАВЛЕНИЕ ==========
C.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touch = {x: t.clientX, y: t.clientY};
}, {passive: false});

C.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

C.addEventListener('touchend', e => {
    e.preventDefault();
    if(!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    const m = 20;
    if(Math.abs(dx) < m && Math.abs(dy) < m) return;
    if(Math.abs(dx) > Math.abs(dy)){
        setDir(dx > 0 ? 1 : -1, 0);
    } else {
        setDir(0, dy > 0 ? 1 : -1);
    }
    touch = null;
}, {passive: false});

document.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp'){ e.preventDefault(); setDir(0,-1); }
    if(e.key === 'ArrowDown'){ e.preventDefault(); setDir(0,1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); setDir(-1,0); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); setDir(1,0); }
    if(e.key === ' ' || e.key === 'Space'){
        e.preventDefault();
        if(!running) restart();
    }
});

function restart(){
    if(loop) clearInterval(loop);
    init();
    loop = setInterval(update, 130);
}

RB.addEventListener('click', restart);
RB.addEventListener('touchend', e => { e.preventDefault(); restart(); });

// ========== ПОЛИФИЛЛ ==========
if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
        if(r > w/2) r = w/2;
        if(r > h/2) r = h/2;
        this.moveTo(x+r,y);
        this.lineTo(x+w-r,y);
        this.quadraticCurveTo(x+w,y,x+w,y+r);
        this.lineTo(x+w,y+h-r);
        this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        this.lineTo(x+r,y+h);
        this.quadraticCurveTo(x,y+h,x,y+h-r);
        this.lineTo(x,y+r);
        this.quadraticCurveTo(x,y,x+r,y);
        this.closePath();
        return this;
    };
}

// ========== ЗАПУСК ==========
init();
loop = setInterval(update, 130);
</script>
</body>
</html>
