<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 ГАЛДА-ЗМЕЙКА</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;display:flex;justify-content:center;align-items:center;height:100vh;touch-action:none;font-family:Arial,sans-serif;overflow:hidden}
canvas{border:2px solid #00ffaa;border-radius:12px;box-shadow:0 0 40px #00ffaa33;background:#0a0a14;touch-action:none;width:90vmin;height:90vmin}
.score{color:#fff;font-size:20px;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:5;text-shadow:0 0 10px #00ffaa66}
.golda{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:bold;color:#ffdd00;text-shadow:0 0 40px #ffdd00;pointer-events:none;opacity:0;z-index:10}
.golda.show{animation:ga .7s ease-out forwards}
@keyframes ga{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.over{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.88);display:none;justify-content:center;align-items:center;flex-direction:column;gap:20px;z-index:20}
.over.show{display:flex}
.over h1{color:#ff1493;font-size:34px;text-shadow:0 0 30px #ff149366}
.over .fs{color:#00ffaa;font-size:22px}
.over .rb{padding:15px 40px;border:2px solid #00ffaa;border-radius:30px;background:transparent;color:#00ffaa;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="score">🐍 Счет: <span id="s">0</span></div>
<canvas id="c"></canvas>
<div class="golda" id="g">ГАЛДА!</div>
<div class="over" id="o"><h1>💀 ИГРА ОКОНЧЕНА</h1><div class="fs">🍎 Счет: <span id="fs">0</span></div><button class="rb" id="rb">🔄 Играть снова</button></div>
<script>
// ========== ПРОСТЫЕ ЗВУКИ (БЕЗ ЛАГОВ) ==========
function playSound(freq, duration, vol) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.value = vol || 0.15;
        osc.start();
        osc.stop(ctx.currentTime + duration);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    } catch(e) {}
}

function soundEat() { playSound(880, 0.12, 0.2); }
function soundOver() { playSound(250, 0.35, 0.15); }
function soundMove() { playSound(600, 0.03, 0.05); }

// ========== ПОЛУЧАЕМ ЭЛЕМЕНТЫ ==========
const C = document.getElementById('c');
const X = C.getContext('2d');
const S = document.getElementById('s');
const FS = document.getElementById('fs');
const O = document.getElementById('o');
const G = document.getElementById('g');
const RB = document.getElementById('rb');

// ========== РАЗМЕРЫ ==========
let SZ = 20;
let COLS, ROWS;

function resize(){
    const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.78, 450);
    C.width = size;
    C.height = size;
    SZ = Math.floor(size / 20);
    COLS = Math.floor(size / SZ);
    ROWS = Math.floor(size / SZ);
}
resize();
window.addEventListener('resize', resize);

// ========== ПЕРЕМЕННЫЕ ==========
let snake = [];
let food = {};
let dir = {x:1, y:0};
let nd = {x:1, y:0};
let score = 0;
let running = true;
let timer = null;
let parts = [];
let touch = null;
let stepCounter = 0;

// ========== ИНИЦИАЛИЗАЦИЯ ==========
function init(){
    const x = Math.floor(COLS/2);
    const y = Math.floor(ROWS/2);
    snake = [{x,y}, {x:x-1,y}, {x:x-2,y}];
    dir = {x:1, y:0};
    nd = {x:1, y:0};
    score = 0;
    parts = [];
    running = true;
    stepCounter = 0;
    O.classList.remove('show');
    S.textContent = '0';
    spawnFood();
    draw();
}

function spawnFood(){
    let p;
    let attempts = 0;
    do {
        p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
        attempts++;
    } while(snake.some(s => s.x === p.x && s.y === p.y) && attempts < 100);
    food = p;
}

// ========== ЧАСТИЦЫ ==========
function addParticles(x, y){
    for(let i=0; i<20; i++){
        parts.push({
            x: x*SZ + SZ/2,
            y: y*SZ + SZ/2,
            vx: (Math.random()-0.5)*8,
            vy: (Math.random()-0.5)*8,
            life: 20,
            max: 20,
            color: ['#ff1493','#ffdd00','#00ccff','#ff00ff','#00ffaa'][Math.floor(Math.random()*5)]
        });
    }
}

function updateParts(){
    for(let i=parts.length-1; i>=0; i--){
        const p = parts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) parts.splice(i, 1);
    }
}

// ========== ОТРИСОВКА ==========
function draw(){
    const w = C.width;
    const h = C.height;
    
    X.fillStyle = '#0a0a14';
    X.fillRect(0, 0, w, h);
    
    // Сетка (редкая)
    X.strokeStyle = '#151525';
    X.lineWidth = 0.5;
    for(let x=0; x<=w; x+=SZ*2){
        X.beginPath();
        X.moveTo(x, 0);
        X.lineTo(x, h);
        X.stroke();
    }
    for(let y=0; y<=h; y+=SZ*2){
        X.beginPath();
        X.moveTo(0, y);
        X.lineTo(w, y);
        X.stroke();
    }
    
    // Змейка
    for(let i=0; i<snake.length; i++){
        const s = snake[i];
        const x = s.x * SZ;
        const y = s.y * SZ;
        const isHead = (i === 0);
        
        if(isHead){
            X.shadowColor = '#00ffaa';
            X.shadowBlur = 15;
        }
        
        X.fillStyle = isHead ? '#00ffaa' : '#00bb77';
        X.fillRect(x+2, y+2, SZ-4, SZ-4);
        
        X.shadowBlur = 0;
        
        // Глаза
        if(isHead){
            const e = 3;
            const off = 5;
            let x1, y1, x2, y2;
            const cx = x + SZ/2;
            const cy = y + SZ/2;
            
            if(dir.x === 1){
                x1 = x + SZ - off; y1 = y + off;
                x2 = x + SZ - off; y2 = y + SZ - off;
            } else if(dir.x === -1){
                x1 = x + off; y1 = y + off;
                x2 = x + off; y2 = y + SZ - off;
            } else if(dir.y === -1){
                x1 = x + off; y1 = y + off;
                x2 = x + SZ - off; y2 = y + off;
            } else {
                x1 = x + off; y1 = y + SZ - off;
                x2 = x + SZ - off; y2 = y + SZ - off;
            }
            
            X.fillStyle = '#fff';
            X.beginPath();
            X.arc(x1, y1, e, 0, Math.PI*2);
            X.fill();
            X.beginPath();
            X.arc(x2, y2, e, 0, Math.PI*2);
            X.fill();
            
            // Зрачки
            X.fillStyle = '#0a0a14';
            X.beginPath();
            X.arc(x1 + dir.x*1.5, y1 + dir.y*1.5, 1.5, 0, Math.PI*2);
            X.fill();
            X.beginPath();
            X.arc(x2 + dir.x*1.5, y2 + dir.y*1.5, 1.5, 0, Math.PI*2);
            X.fill();
        }
    }
    
    // Еда
    const fx = food.x * SZ;
    const fy = food.y * SZ;
    const pulse = 3 * (Date.now() % 400 / 400);
    X.shadowColor = '#ff1493';
    X.shadowBlur = 15 + pulse;
    X.fillStyle = '#ff1493';
    X.beginPath();
    X.arc(fx + SZ/2, fy + SZ/2, SZ/2 - 3, 0, Math.PI*2);
    X.fill();
    X.shadowBlur = 0;
    
    // Блик
    X.fillStyle = 'rgba(255,255,255,0.2)';
    X.beginPath();
    X.arc(fx + 6, fy + 6, 3, 0, Math.PI*2);
    X.fill();
    
    // Частицы
    for(const p of parts){
        const a = p.life / p.max;
        X.globalAlpha = a;
        X.fillStyle = p.color;
        X.beginPath();
        X.arc(p.x, p.y, 3*a + 1, 0, Math.PI*2);
        X.fill();
    }
    X.globalAlpha = 1;
}

// ========== ИГРОВОЙ ЦИКЛ ==========
function update(){
    if(!running) return;
    
    dir = {...nd};
    const head = snake[0];
    const newHead = {x: head.x + dir.x, y: head.y + dir.y};
    
    // Стены
    if(newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS){
        running = false;
        FS.textContent = score;
        O.classList.add('show');
        soundOver();
        return;
    }
    
    // Собственное тело
    if(snake.some(s => s.x === newHead.x && s.y === newHead.y)){
        running = false;
        FS.textContent = score;
        O.classList.add('show');
        soundOver();
        return;
    }
    
    snake.unshift(newHead);
    
    // Звук движения (каждый 2 шаг)
    stepCounter++;
    if(stepCounter % 2 === 0) soundMove();
    
    // Съедание
    if(newHead.x === food.x && newHead.y === food.y){
        score++;
        S.textContent = score;
        addParticles(food.x, food.y);
        soundEat();
        
        // Показать "ГАЛДА!"
        G.classList.remove('show');
        void G.offsetWidth;
        G.classList.add('show');
        setTimeout(() => G.classList.remove('show'), 700);
        
        spawnFood();
    } else {
        snake.pop();
    }
    
    updateParts();
    draw();
}

// ========== УПРАВЛЕНИЕ ==========
function setDir(dx, dy){
    if(dir.x !== -dx || dir.y !== -dy){
        nd = {x: dx, y: dy};
    }
}

// Тач
C.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touch = {x: t.clientX, y: t.clientY};
}, {passive: false});

C.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

C.addEventListener('touchend', e => {
    e.preventDefault();
    if(!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    const minSwipe = 15;
    if(Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    if(Math.abs(dx) > Math.abs(dy)){
        setDir(dx > 0 ? 1 : -1, 0);
    } else {
        setDir(0, dy > 0 ? 1 : -1);
    }
    touch = null;
}, {passive: false});

// Клавиатура
document.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp'){ e.preventDefault(); setDir(0, -1); }
    if(e.key === 'ArrowDown'){ e.preventDefault(); setDir(0, 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); setDir(-1, 0); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); setDir(1, 0); }
    if(e.key === ' ' || e.key === 'Space'){
        e.preventDefault();
        if(!running){
            if(timer) clearInterval(timer);
            init();
            timer = setInterval(update, 120);
        }
    }
});

// Рестарт
function restart(){
    if(timer) clearInterval(timer);
    init();
    timer = setInterval(update, 120);
}
RB.addEventListener('click', restart);
RB.addEventListener('touchend', e => { e.preventDefault(); restart(); });

// ========== ЗАПУСК ==========
init();
timer = setInterval(update, 120);
</script>
</body>
</html>
